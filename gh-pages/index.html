<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis Tool</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js for visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sentiment Analysis Tool</h1>
            <p>Enter text below to analyze its sentiment.</p>
        </header>

        <main>
            <div class="input-section">
                <textarea id="textInput" placeholder="Type or paste your text here..." maxlength="1000"></textarea>
                <div class="char-counter">
                    <span id="currentCharCount">0</span> / 1000
                </div>
                <button id="analyzeBtn">Analyze Sentiment</button>
            </div>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Analyzing...</p>
            </div>

            <div id="resultSection" class="hidden">
                <div class="result-card">
                    <div id="sentimentEmoji" class="emoji"></div>
                    <h2 id="sentimentLabel"></h2>
                    <p>Polarity Score: <span id="polarityScore"></span></p>
                    <div class="chart-container">
                        <canvas id="polarityChart"></canvas>
                    </div>
                </div>
            </div>

            <div id="errorMessage" class="error hidden"></div>
        </main>

        <footer>
            <p>&copy; 2026 Sentiment Analysis Tool</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
